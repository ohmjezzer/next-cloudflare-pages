name: Cloudflare Pages Preview Deploy (Wrangler Action)

# กำหนดให้ Workflow ทำงานเมื่อเกิดเหตุการณ์ Pull Request
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# กำหนดสิทธิ์ที่จำเป็น (สำคัญสำหรับการ comment และ deployment status)
permissions:
  contents: read
  pull-requests: write 
  deployments: write

env:
  # 💡 ปรับเปลี่ยนค่าเหล่านี้ให้เป็นของคุณ
  PROJECT_NAME: next-cloudflare-pages # ชื่อ Project ใน Cloudflare Pages
  DIST_FOLDER: out # โฟลเดอร์ผลลัพธ์หลังจากการ Build

jobs:
  # --------------------------------------------------------------------------
  # A. Job สำหรับการสร้าง/อัปเดต Deployment (ข้อ 1, 2, 3, 5, 6)
  # --------------------------------------------------------------------------
  deploy_preview:
    name: 🚀 Deploy Preview (Wrangler)
    runs-on: ubuntu-latest
    
    # 💡 เงื่อนไขการทำงาน: ทำงานเมื่อ PR ถูก Opened, Synchronize, หรือ Reopened
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened')

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      # 1. ติดตั้ง Dependencies และ Build (ถ้ามี)
      - name: 🛠️ Setup Node.js & Build (Optional)
        uses: actions/setup-node@v4
        with:
          node-version: '20' 
      - run: npm install # หรือคำสั่ง build อื่นๆ
      - run: npm run build # หรือคำสั่ง build อื่นๆ

      # 2. Deploy Cloudflare Pages โดยใช้คำสั่ง Wrangler (ข้อ 1, 2, 3, 5)
      - name: 🚀 Publish to Cloudflare Pages
        id: deploy # 👈 กำหนด ID เพื่อจับ Output
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # คำสั่ง Wrangler Pages Deploy
          command: pages deploy ${{ env.DIST_FOLDER }} --project-name=${{ env.PROJECT_NAME }}
          # Wrangler จะดึงข้อมูล branch และ commit จาก GitHub context มาใช้ในการสร้าง Preview deployment ให้อัตโนมัติ

      # 3. Comment Preview URL ใน Pull Request (ข้อ 6)
      - name: 💬 Comment Preview URL on Pull Request
        uses: peter-evans/create-or-update-comment@v3 
        with:
          issue-number: ${{ github.event.pull_request.number }}
          # ใช้ output variable 'pages-deployment-alias-url' สำหรับ URL ของ Preview branch
          body: |
            🎉 **Cloudflare Pages Preview Deployment**
            
            Deployment Status: **Succeeded**
            
            🔗 **Preview URL:** ${{ steps.deploy.outputs.pages-deployment-alias-url }} 
            
            _Deployment will be destroyed when the Pull Request is closed or merged._
          update-key: pr-preview-deployment-url
          
  # --------------------------------------------------------------------------
  # B. Job สำหรับการทำลาย Deployment (Cleanup) (ข้อ 4)
  # --------------------------------------------------------------------------
  cleanup_deployment:
    name: 🧹 Cleanup Preview Deployment
    runs-on: ubuntu-latest
    
    # 💡 เงื่อนไขการทำงาน: ทำงานเมื่อ PR ถูกปิด (closed) หรือถูก Merge
    if: github.event.action == 'closed'

    steps:
      - name: 🧹 Delete Cloudflare Preview Deployment
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # คำสั่ง Wrangler สำหรับลบ Deployment ของ Branch นั้นๆ
          # เราต้องใช้คำสั่ง pages deployment delete โดยใช้ commit hash
          # เนื่องจาก Wrangler ไม่มีคำสั่ง Pages deployment delete by branch โดยตรง
          # การลบต้องใช้ API โดยตรง แต่เราจะใช้ pages project delete-branch แทนเพื่อความง่าย
          
          # หมายเหตุ: 'wrangler pages project delete-branch' จะลบ branch deployment ทั้งหมด
          # คำสั่งนี้เป็นวิธีที่ง่ายที่สุดในการ cleanup โดยใช้ Wrangler
          command: pages project delete-branch ${{ github.head_ref }} --project-name=${{ env.PROJECT_NAME }}